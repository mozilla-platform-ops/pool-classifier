[project]
name = "worker-health"
version = "1.1.13"
authors = [
    { name = "Andrew Erickson", email = "aerickson@mozilla.com" }
]
requires-python = ">=3.14"
description = "Taskcluster pool classifier service and dashboard"
readme = "README.md"
license = "MPL-2.0"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "alive-progress>=3.3.0",
    "colorama>=0.4.6",
    "flask>=3.1.3",
    "gitpython>=3.1.57",
    "google-auth>=2.56.2",
    "gunicorn>=26.0.0",
    "humanhash3>=0.0.6",
    "influxdb>=5.3.2",
    "natsort>=8.4.0",
    "pendulum>=3.2.0",
    "psycopg-pool>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "rstr>=3.2.2",
    "schedule>=1.2.2",
    "sentry-sdk>=2.66.1",
    "taskcluster>=102.0.1",
    "testdroid>=3.2",
    "toml>=0.10.2",
    "tomlkit>=0.15.1",
    "typing-extensions>=4.16.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
# Begin with the Pyflakes-equivalent rules currently provided by `pyflakes`.
# Additional Ruff rule families can be enabled incrementally.
select = ["F"]

[dependency-groups]
dev = [
    "ipdb>=0.13.13",
    "prek>=0.4.11",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "pytest-watch>=4.2.0",
    "ruff>=0.16.0",
]
