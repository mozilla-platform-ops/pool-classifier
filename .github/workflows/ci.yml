name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run prek
        run: uv run --frozen --group dev prek run --all-files

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pool_classifier
          POSTGRES_USER: pc
          POSTGRES_PASSWORD: pc
        options: >-
          --health-cmd "pg_isready -U pc -d pool_classifier"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PC_TEST_DATABASE_URL: postgresql://pc:pc@localhost:5432/pool_classifier
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.7"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Run full test suite
        run: uv run --frozen --group dev pytest tests/ -x -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build production image
        run: docker build --build-arg POOL_CLASSIFIER_COMMIT="${{ github.sha }}" .
