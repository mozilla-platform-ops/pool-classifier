name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pool_classifier
          POSTGRES_USER: pc
          POSTGRES_PASSWORD: pc
        options: >-
          --health-cmd "pg_isready -U pc -d pool_classifier"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      PC_TEST_DATABASE_URL: postgresql://pc:pc@localhost:5432/pool_classifier
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pipenv
          cache-dependency-path: Pipfile.lock
      - name: Install Pipenv
        run: python -m pip install --upgrade pipenv
      - name: Install dependencies
        run: pipenv sync --dev
      - name: Run full test suite
        run: pipenv run pytest tests/ -x -q

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build production image
        run: docker build --build-arg POOL_CLASSIFIER_COMMIT="${{ github.sha }}" .
